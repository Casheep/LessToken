name: Windows checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Configure and build
        shell: pwsh
        run: |
          cmake -S . -B build -A x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build --config Release --parallel 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force plugins/lesstoken/bin | Out-Null
          Copy-Item build/Release/lesstoken.exe plugins/lesstoken/bin/lesstoken.exe
      - name: Regression tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Local package self-check
        shell: powershell
        run: .\scripts\verify.ps1
      - name: Public source audit
        run: python scripts/prepare_github.py
